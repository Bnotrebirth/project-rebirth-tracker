name: Collect player history

# Optional and manual: the watcher worker now records player-count samples in
# KV on its own 2-minute cron and serves them at /history.json, which is what
# both sites chart. Trigger this by hand only if you want a sample committed
# to the repo as a backup.
#
# Needs the GAME_API_URL repository secret (Settings → Secrets and variables
# → Actions). The endpoint is never written into this repo.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect one sample
        env:
          GAME_API_URL: ${{ secrets.GAME_API_URL }}
        run: python collect.py --once

      - name: Commit updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "Update player history"
            git push
          fi
