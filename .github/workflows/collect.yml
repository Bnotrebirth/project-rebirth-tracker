name: Collect player history

on:
  schedule:
    # every 5 minutes (GitHub's fastest cron). Fills the chart for everyone.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect one sample from the game API
        run: python collect.py --once

      - name: Commit updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "Update player history"
            git push
          fi
