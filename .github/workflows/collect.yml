name: Collect player history

on:
  schedule:
    # Every 10 min, deliberately offset off the :00 mark — GitHub coalesces and
    # delays triggers clustered at the top of the hour, which is what made a
    # naive "*/5" effectively run every ~30 min. 6 runs/hr also stays under
    # GitHub Pages' ~10-builds/hr limit so the served data doesn't lag.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect one sample from the game API
        run: python collect.py --once

      - name: Commit updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "Update player history"
            git push
          fi
